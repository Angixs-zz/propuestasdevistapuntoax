function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(iso){if(!iso)return 'Sin seleccionar';const [y,m,d]=iso.split('-').map(Number);return new Intl.DateTimeFormat('es-MX',{day:'numeric',month:'long',year:'numeric',weekday:'long'}).format(new Date(y,m-1,d,12));}
function isoLocal(date){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');}
function addDays(date,n){let v=new Date(date);v.setDate(v.getDate()+n);return v;}

function safePage(page){const protectedPages=['mapa','detalle','cita-datos','cita-calendario','cita-exito','mis-citas','perfil','clinica'];if(protectedPages.includes(page)&&!state.session){state.wanted=page==='detalle'?'mapa':page.startsWith('cita')?'mapa':page;state.authMode='login';return 'acceso';}if(state.session?.role==='clinica'&&['mapa','detalle','cita-datos','cita-calendario','cita-exito','mis-citas'].includes(page))return 'clinica';if(state.session?.role==='usuario'&&page==='clinica')return 'mapa';return page;}
const pages=['inicio','conocenos','orientacion','acceso','mapa','detalle','cita-datos','cita-calendario','cita-exito','mis-citas','clinica','perfil'];
function go(page){if(!pages.includes(page))page='inicio';if(location.hash.slice(1)===page)render();else location.hash=page;}

function home(){return `<section class="hero"><div class="wrap hero-grid"><div><span class="eyebrow">Bienvenido a PuntOax</span><h1>Información clara para encontrar <span class="accent">atención en Oaxaca.</span></h1><p class="heading-lead">Somos una propuesta digital que busca facilitar la localización de centros relacionados con la detección de ITS, la orientación en salud sexual y los servicios de interrupción legal del embarazo (ILE).</p><div class="hero-btns"><button class="btn btn-green btn-lg" data-action="get-started">Explorar centros →</button><button class="btn btn-outline btn-lg" data-page="conocenos">Conoce el proyecto</button></div><div class="mini-trust"><span class="trust-check">✓</span><span>Información organizada</span><span>·</span><span>Diseño discreto y accesible</span></div></div><div class="hero-visual" aria-label="Ilustración conceptual de centros localizables sobre un mapa"><div class="paper-map"><svg viewBox="0 0 470 390" preserveAspectRatio="xMidYMid slice"><rect width="470" height="390" fill="#e6f0e6"/><path d="M-30 60 C70 108 80 8 160 78S323 136 490 35" fill="none" stroke="#fff" stroke-width="31"/><path d="M40 410 C120 285 130 294 260 225S378 126 486 168" fill="none" stroke="#fff" stroke-width="25"/><path d="M-10 245 C100 230 120 160 205 168 S365 295 510 300" fill="none" stroke="#fff" stroke-width="22"/><path d="M270 -35 C245 70 330 140 321 242 S350 345 386 420" fill="none" stroke="#fff" stroke-width="21"/><path d="M95 -10 C120 90 47 152 62 220 S115 360 132 410" fill="none" stroke="#fff" stroke-width="15"/><path d="M17 157 C85 120 137 170 168 214" fill="none" stroke="#badbc4" stroke-width="5" stroke-dasharray="10 13"/><path d="M25 20 C90 30 124 35 135 65L89 121L25 110Z" fill="#cde4d4"/><path d="M359 289L443 268L470 320L421 385L365 361Z" fill="#cce3d0"/><g fill="#197f69" stroke="#fff" stroke-width="5"><circle cx="233" cy="191" r="16"/><circle cx="143" cy="286" r="13"/><circle cx="360" cy="117" r="14"/></g><g fill="#fff"><circle cx="233" cy="191" r="5"/><circle cx="143" cy="286" r="4"/><circle cx="360" cy="117" r="5"/></g></svg></div><div class="visual-top"><span class="floating-icon">⌖</span><div>Encuentra servicios<br><span class="muted" style="font-size:10px">En tu zona de Oaxaca</span></div></div><div class="visual-bottom"><span class="demo-pill">✳ Vista conceptual</span><b>Mapa y fichas de atención</b><div class="muted">Busca, compara información y consulta detalles en un solo lugar.</div></div></div></div></section><section class="section section-alt"><div class="wrap"><div class="section-header"><span class="eyebrow">¿Qué es PuntOax?</span><h2>Un punto de partida para buscar información útil.</h2><p class="heading-lead">Nuestro objetivo es acercar información organizada de centros y servicios, para que tomar una decisión informada sea más sencillo.</p></div><div class="three-grid"><article class="soft-card"><div class="iconbox">⌖</div><h3>Encuentra centros</h3><p>Explora ubicaciones en el mapa y en una lista. Busca por municipio o el tipo de atención que necesitas.</p></article><article class="soft-card"><div class="iconbox">▤</div><h3>Consulta sus fichas</h3><p>Conoce los servicios, horarios, requisitos, costos y la información proporcionada por cada centro.</p></article><article class="soft-card"><div class="iconbox">◴</div><h3>Solicita una cita</h3><p>Visualiza el recorrido para completar tus datos y escoger un horario, cuando el centro disponga de esa opción.</p></article></div></div></section><section class="section"><div class="wrap"><div class="section-header"><span class="eyebrow">Cómo funciona</span><h2>Tres pasos para comenzar.</h2><p class="heading-lead">En esta propuesta, el directorio y el mapa estarán disponibles después de iniciar sesión.</p></div><div class="steps"><article class="step"><div class="step-num">01</div><h3>Crea tu cuenta</h3><p>Elige entre usuario o clínica. Para comenzar, solo solicitamos un correo y una contraseña.</p></article><article class="step"><div class="step-num">02</div><h3>Busca en el mapa</h3><p>Filtra los puntos de atención, abre un resumen o consulta la ficha completa.</p></article><article class="step"><div class="step-num">03</div><h3>Elige un horario</h3><p>Si deseas solicitar una cita, completa tus datos y selecciona una fecha y hora disponible.</p></article></div></div></section><section class="section section-alt"><div class="wrap"><div class="split" style="align-items:center"><div><span class="eyebrow">Tu privacidad importa</span><h2>Consulta con mayor discreción.</h2><p class="heading-lead">El registro está pensado para ser sencillo y evitar pedir datos personales adicionales desde el primer momento.</p><ul class="feature-list"><li><span class="check-circle">✓</span>Solo correo y contraseña para una cuenta tradicional.</li><li><span class="check-circle">✓</span>Datos adicionales únicamente cuando solicitas una cita.</li><li><span class="check-circle">✓</span>Opción visual de continuar con Google.</li></ul><p class="small muted">Estas son decisiones de diseño. La seguridad y el tratamiento real de datos deberán implementarse en el backend.</p></div><div class="quote-panel"><span class="eyebrow">Un diseño humano</span><b>“La información adecuada puede hacer más fácil dar el siguiente paso.”</b><p class="muted" style="margin:0">PuntOax busca que las personas puedan orientarse sin interfaces complejas.</p></div></div></div></section><section class="section"><div class="wrap"><div class="banner"><div><h2>¿Listo para conocer PuntOax?</h2><p>Regístrate como usuario para explorar el directorio o como clínica para comenzar a conocer el espacio de gestión.</p></div><button class="btn btn-green btn-lg" data-action="auth-register">Crear cuenta →</button></div></div></section>`;}
function about(){return `<section class="page-intro"><div class="wrap"><span class="eyebrow">El proyecto</span><h1>Conócenos</h1><p>El propósito de PuntOax y las razones por las que estamos diseñando esta plataforma.</p></div></section><section class="section"><div class="wrap split" style="align-items:center"><div><span class="eyebrow">Nuestra propuesta</span><h2>Un puente entre las personas y la información.</h2><p class="heading-lead">PuntOax es un proyecto académico orientado al desarrollo de una plataforma web que facilite localizar centros de detección de ITS y servicios vinculados con la interrupción legal del embarazo en Oaxaca.</p><p class="muted">A través de un mapa, filtros y fichas informativas buscamos reunir datos útiles para consultar alternativas de atención y sus características.</p></div><div class="quote-panel"><div style="font-size:42px;color:var(--green)">◎</div><b>Información, orientación y acceso.</b><p>La plataforma pretende ofrecer una experiencia sencilla, intuitiva y respetuosa con la privacidad.</p></div></div></section><section class="section section-alt"><div class="wrap"><span class="eyebrow">Principios del proyecto</span><h2 style="margin-top:14px">¿Qué buscamos cuidar?</h2><div class="three-grid"><article class="soft-card"><div class="iconbox">✓</div><h3>Claridad</h3><p>Información fácil de leer, organizada y comprensible para diferentes usuarios.</p></article><article class="soft-card"><div class="iconbox">◉</div><h3>Privacidad</h3><p>Solicitar únicamente los datos necesarios para cada funcionalidad.</p></article><article class="soft-card"><div class="iconbox">⌖</div><h3>Accesibilidad</h3><p>Una experiencia adaptable a teléfonos, computadoras y distintos contextos de uso.</p></article></div></div></section><section class="section"><div class="wrap"><div class="banner"><div><h2>Explora la experiencia de PuntOax</h2><p>Ingresa al recorrido interactivo del prototipo.</p></div><button class="btn btn-green" data-action="get-started">Comenzar →</button></div></div></section>`;}
function education(){return `<section class="page-intro"><div class="wrap"><span class="eyebrow">Información introductoria</span><h1>Orientación y preguntas frecuentes</h1><p>En una versión futura, esta sección reunirá contenido educativo revisado y recursos oficiales.</p></div></section><section class="section"><div class="wrap"><div class="three-grid"><article class="soft-card"><div class="iconbox">♡</div><h3>¿Qué son las ITS?</h3><p>Las infecciones de transmisión sexual son infecciones que pueden transmitirse mediante contacto sexual. La orientación clínica ayuda a determinar qué pruebas son adecuadas.</p></article><article class="soft-card"><div class="iconbox">⌖</div><h3>¿Cómo buscar atención?</h3><p>Utiliza los filtros para encontrar centros por municipio y servicios, y consulta la ficha antes de acudir.</p></article><article class="soft-card"><div class="iconbox">▤</div><h3>¿Qué es la ILE?</h3><p>Interrupción Legal del Embarazo. Las condiciones legales y la disponibilidad de servicios requieren información oficial y actualizada.</p></article></div><div class="accordion" style="max-width:870px;margin:44px auto 0"><h2>Preguntas frecuentes</h2><details><summary>¿Necesito registrarme para ver el mapa?</summary><p>Según el recorrido previsto para esta propuesta de interfaz, sí. Después de registrarte con correo y contraseña podrás acceder al directorio y sus fichas.</p></details><details><summary>¿Tengo que compartir todos mis datos al crear una cuenta?</summary><p>No. El registro básico está diseñado solo con correo y contraseña. Los datos de identificación se solicitan al iniciar una cita de demostración.</p></details><details><summary>¿Las citas y ubicaciones ya son reales?</summary><p>No. Este es un prototipo visual: centros, horarios y citas son simulados. No se debe utilizar para localizar atención real.</p></details><details><summary>¿PuntOax sustituye una consulta médica?</summary><p>No. Su objetivo es facilitar la búsqueda y comprensión de información, no diagnosticar o proporcionar tratamientos.</p></details></div></div></section>`;}
function auth(){let signup=state.authMode==='registro',role=state.authRole;return `<div class="wrap auth-wrap"><aside class="auth-info"><span class="eyebrow" style="color:#a8e4c3">Acceso PuntOax</span><h2>Una experiencia pensada para la confianza.</h2><p>Accede al mapa y descubre las herramientas de información. El proceso de registro es distinto para usuarios y clínicas.</p><div class="auth-facts"><p><span>✓</span> Registro inicial con correo y contraseña</p><p><span>✓</span> Exploración después de ingresar</p><p><span>✓</span> Datos adicionales solo al solicitar una cita</p></div></aside><section class="form-shell"><span class="eyebrow">${signup?'Crear cuenta':'Bienvenido de nuevo'}</span><h2>${signup?'Únete a PuntOax':'Iniciar sesión'}</h2><p>${signup?'Selecciona cómo deseas ingresar a la plataforma.':'Selecciona el tipo de cuenta con el que deseas continuar.'}</p><div class="segmented" role="group" aria-label="Tipo de cuenta"><button type="button" class="segment ${role==='usuario'?'active':''}" data-action="set-role" data-value="usuario" aria-pressed="${role==='usuario'}">◯ Soy usuario</button><button type="button" class="segment ${role==='clinica'?'active':''}" data-action="set-role" data-value="clinica" aria-pressed="${role==='clinica'}">✚ Soy clínica</button></div><div class="note-box" style="margin:0 0 18px">${role==='usuario'?'Cuenta personal: acceder al mapa, ver fichas y solicitar citas.':'Cuenta clínica: ingresar al área donde las instituciones podrán gestionar su información y solicitudes.'}</div><form id="auth-form"><label class="field-label" for="auth-email">Correo electrónico</label><input id="auth-email" class="field" name="email" type="email" autocomplete="email" required placeholder="tu.correo@ejemplo.com" maxlength="120"/><label class="field-label" for="auth-password">Contraseña</label><input id="auth-password" class="field" name="password" type="password" autocomplete="${signup?'new-password':'current-password'}" minlength="6" required placeholder="Mínimo 6 caracteres" maxlength="100"/>${signup?`<label class="field-label" for="auth-confirm">Confirmar contraseña</label><input id="auth-confirm" class="field" name="confirm" type="password" autocomplete="new-password" minlength="6" required placeholder="Repite tu contraseña" maxlength="100"/>`:''}<button class="btn btn-green btn-block" style="margin-top:25px" type="submit">${signup?'Crear cuenta y continuar':'Ingresar a PuntOax'} →</button></form><div class="login-divider">o continúa con</div><button class="google-btn" type="button" data-action="google-demo"><span class="google-g">G</span> Continuar con Google</button><p class="form-note" style="text-align:center;margin-top:18px">${signup?'¿Ya tienes una cuenta?':'¿Todavía no tienes una cuenta?'} <button class="text-link" data-action="toggle-auth">${signup?'Inicia sesión':'Regístrate aquí'}</button></p><div class="note-box amber">✳ Prototipo: el correo y la contraseña <b>no se envían ni almacenan</b>. Google es un botón simulado; no se realiza autenticación real.</div></section></div>`;}
function directory(){let cities=[...new Set(DEMO_CENTERS.map(c=>c.city))];return `<section class="wrap directory-shell"><div class="directory-title"><div><span class="eyebrow">Directorio de PuntOax</span><h1>Encuentra un centro de atención.</h1><p>Explora el mapa y las fichas de centros de demostración. Usa filtros para comparar.</p></div><span class="demo-pill">✳ Centros ficticios para diseño</span></div><div class="toolbar"><input class="field query" id="filter-query" placeholder="⌕ Buscar centro, municipio o servicio" aria-label="Buscar centro" value="${esc(state.filters.query)}"/><select class="field" id="filter-service" aria-label="Filtrar por servicio"><option value="">Todos los servicios</option>${['Detección de ITS','ILE','Orientación'].map(s=>`<option value="${esc(s)}" ${state.filters.service===s?'selected':''}>${esc(s)}</option>`).join('')}</select><select class="field" id="filter-city" aria-label="Filtrar por municipio"><option value="">Todos los municipios</option>${cities.map(c=>`<option ${state.filters.city===c?'selected':''} value="${esc(c)}">${esc(c)}</option>`).join('')}</select><select class="field" id="filter-cost" aria-label="Filtrar por costo"><option value="">Cualquier costo</option><option value="Gratuito" ${state.filters.cost==='Gratuito'?'selected':''}>Gratuito</option><option value="Costo variable" ${state.filters.cost==='Costo variable'?'selected':''}>Costo variable</option></select><button class="btn btn-outline tool-btn" data-action="reset-filters">Limpiar</button></div><div class="dir-grid"><section class="dir-results" aria-label="Resultados de búsqueda"><p class="bold small" style="margin:0 0 13px" id="result-count"></p><div id="results"></div></section><section class="map-stage" aria-label="Mapa interactivo demostrativo"><div class="fallback-map" id="fallback-map"></div><div class="real-map" id="real-map"></div><div class="map-label">${iconPin()} <span>Oaxaca · Mapa de ejemplo</span><br/><span class="muted" style="font-weight:500">Selecciona un marcador para ver su resumen.</span></div><div class="map-footer"><span>⚠ Ubicaciones aproximadas por ciudad; no son direcciones de clínicas reales.</span></div></section></div><p class="mini-help" style="margin:17px 0 0">La geolocalización y rutas reales se integrarán cuando existan establecimientos, direcciones y permisos verificados.</p></section>`;}
function filteredCenters(){let f=state.filters;const normalized=x=>String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let q=normalized(f.query.trim());return DEMO_CENTERS.filter(c=>(!q||normalized([c.name,c.city,c.zone,c.service.join(' ')].join(' ')).includes(q))&&(!f.service||c.service.includes(f.service))&&(!f.city||c.city===f.city)&&(!f.cost||c.cost===f.cost));}
function resultHTML(c){return `<article class="result-card ${state.selected===c.id?'selected':''}" id="card-${esc(c.id)}"><span class="demo-pill">Centro de ejemplo</span><h3>${esc(c.name)}</h3><p>${iconPin()} ${esc(c.city)} · ${esc(c.zone)}</p><div class="chip-row">${c.service.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}<span class="chip">${esc(c.cost)} (demo)</span></div><div class="result-actions"><button class="btn btn-ghost btn-sm" data-action="focus-center" data-id="${c.id}">Ver en mapa</button><button class="btn btn-green btn-sm" data-action="open-detail" data-id="${c.id}">Ficha completa →</button></div></article>`;}
function renderResults(){let list=filteredCenters();let count=$('result-count'),container=$('results');if(!count||!container)return;count.textContent=`${list.length} resultado${list.length===1?'':'s'} de demostración`;container.innerHTML=list.length?list.map(resultHTML).join(''):'<div class="empty"><b>No se encontraron coincidencias.</b><p>Prueba con otro municipio o elimina los filtros.</p><button class="btn btn-ghost btn-sm" data-action="reset-filters">Limpiar filtros</button></div>';refreshMarkers(list);}
function popupContent(c){return `<div><span class="demo-pill">Solo demostración</span><div class="pop-name">${esc(c.name)}</div><div class="small muted">${esc(c.city)}<br>${esc(c.service.join(' · '))}</div><div class="pop-actions"><button type="button" data-action="route-demo" data-id="${c.id}">Cómo llegar</button><button type="button" data-action="open-detail" data-id="${c.id}">Ficha completa →</button></div></div>`;}
function initDirectoryMap(){if(!$('real-map'))return;if(window.L){try{map=L.map('real-map',{scrollWheelZoom:false}).setView([17.12,-96.73],8);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:18}).addTo(map);map.on('tileerror',()=>{fallbackMode=true;});map.invalidateSize();refreshMarkers(filteredCenters());return;}catch(e){map=null;}}showFallbackMap(filteredCenters());}
function showFallbackMap(list){let e=$('fallback-map');if(!e)return;const positions={'punto-1':[44,42],'punto-3':[49,38],'punto-4':[45,52],'punto-7':[58,43],'punto-10':[18,30],'punto-13':[16,75],'punto-14':[77,72],'punto-19':[47,48]};e.innerHTML=list.map(c=>{let ps=positions[c.id]||[50,50];return `<button class="fallback-pin" title="${esc(c.name)}" aria-label="Ver ${esc(c.name)}" data-action="fallback-focus" data-id="${c.id}" style="left:${ps[0]}%;top:${ps[1]}%"><b>+</b></button>`;}).join('');}
function refreshMarkers(list){showFallbackMap(list);if(!map||!window.L)return;mapMarkers.forEach(m=>map.removeLayer(m));mapMarkers=list.map(c=>{let marker=L.circleMarker([c.lat,c.lng],{color:'#fff',weight:3,fillColor:state.selected===c.id?'#0b564a':'#1a9074',fillOpacity:1,radius:state.selected===c.id?12:10}).addTo(map);marker.bindPopup(popupContent(c),{maxWidth:290});marker.on('click',()=>{state.selected=c.id;let card=$('card-'+c.id);if(card)card.scrollIntoView({behavior:'smooth',block:'nearest'});containerSelected();});return marker;});}
function containerSelected(){document.querySelectorAll('.result-card').forEach(el=>el.classList.toggle('selected',el.id==='card-'+state.selected));}
function focusCenter(id){const c=centerById(id);state.selected=c.id;containerSelected();if(map){map.setView([c.lat,c.lng],Math.max(map.getZoom(),11));let m=mapMarkers.find(m=>{let p=m.getLatLng();return Math.abs(p.lat-c.lat)<.0001&&Math.abs(p.lng-c.lng)<.0001;});m?.openPopup();}else{notify(`Vista de marcador: ${c.name}. Selecciona «Ficha completa» para continuar.`);}}
function detail(){let c=centerById(state.selected);return `<section class="page-intro"><div class="wrap"><button class="text-link" data-page="mapa">← Volver al mapa</button><div style="margin-top:15px"><span class="eyebrow">Ficha completa del centro</span><h1>${esc(c.name)}</h1><p>${esc(c.city)} · ${esc(c.zone)} · Oaxaca</p></div></div></section><div class="wrap detail-wrap"><div class="box-card"><div class="detail-header"><div><span class="demo-pill">Ficha no verificada · Demostración</span><h2 style="font-size:26px;margin:16px 0 6px">Información general</h2></div></div><p class="detail-blurb">${esc(c.description)}</p><div class="divider"></div><section class="detail-section"><h3>Servicios disponibles (ejemplo)</h3><div class="service-tags">${c.service.map(s=>`<span>${esc(s)}</span>`).join('')}</div></section><div class="divider"></div><section class="detail-section"><h3>Datos del centro</h3><div class="info-grid"><div class="info-item"><b>◷ Horarios de atención</b><span>${esc(c.hours)}</span></div><div class="info-item"><b>◇ Costo</b><span>${esc(c.cost)} · ejemplo</span></div><div class="info-item"><b>▤ Requisitos</b><span>${esc(c.requirements)}</span></div><div class="info-item"><b>⌁ Tipo de institución</b><span>${esc(c.type)}</span></div><div class="info-item"><b>⌖ Dirección</b><span>Sin dirección real. Ubicación de ciudad aproximada.</span></div><div class="info-item"><b>☏ Contacto</b><span>${esc(c.phone)}</span></div></div></section><div class="divider"></div><section class="detail-section"><h3>Información y transparencia</h3><p class="muted small">En la versión definitiva, aquí se mostrarán las fuentes oficiales, la fecha de actualización, los servicios acreditados y los datos proporcionados por la clínica. En esta maqueta no se verifican centros.</p><div class="note-box amber">⚠ El nombre del centro, sus horarios, requisitos, costos y disponibilidad son ficticios y solo sirven para evaluar la interfaz.</div></section><div class="detail-book"><span class="eyebrow">Siguiente paso</span><h3>¿Quieres generar una cita?</h3><p>Para continuar, primero completarás tus datos personales y después elegirás una fecha y un horario.</p><button class="btn btn-green btn-lg" data-action="start-booking">Generar cita →</button></div></div><aside><div class="box-card"><h3>Ubicación del centro</h3><p class="small muted">Mapa de referencia de la localidad</p><div class="detail-map" id="detail-map"><div class="fallback-map" style="z-index:0"></div></div><div class="action-row"><button class="btn btn-green btn-block" data-action="route-demo" data-id="${c.id}">⌖ Cómo llegar</button></div><div class="divider"></div><h3>Fuente de la información</h3><p class="small muted">Sin verificar · ficha ilustrativa</p><p class="small muted">Última actualización: no disponible</p></div><div class="note-box" style="margin-top:14px">💡 En el sistema final, la clínica podrá publicar datos revisables y la persona usuaria podrá consultarlos antes de agendar.</div></aside></div>`;}
function initDetailMap(){const el=$('detail-map');if(!el)return;let c=centerById(state.selected);if(!window.L){return;}try{detailMap=L.map('detail-map',{zoomControl:false,scrollWheelZoom:false,dragging:false}).setView([c.lat,c.lng],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(detailMap);L.circleMarker([c.lat,c.lng],{color:'#fff',weight:4,fillColor:'#16856b',fillOpacity:1,radius:11}).addTo(detailMap);detailMap.invalidateSize();}catch(e){detailMap=null;}}
function routeDemo(id){let c=centerById(id);$('modal-root').innerHTML=`<div class="overlay" id="route-overlay" role="dialog" aria-modal="true" aria-labelledby="route-title"><div class="modal"><span class="eyebrow">Cómo llegar</span><h2 id="route-title">Vista previa de indicaciones</h2><div class="route-illustration"><svg viewBox="0 0 450 140"><rect width="450" height="140" fill="#e8f1e7"/><path d="M-20 32 L120 85 L260 20 L470 110" stroke="#fff" stroke-width="28" fill="none"/><path d="M120 -10 L140 170 M315 -15 L285 160" stroke="#fff" stroke-width="22"/><path d="M95 90 Q220 100 235 38" fill="none" stroke="#178970" stroke-width="5" stroke-dasharray="8 7"/><circle cx="95" cy="90" r="10" fill="#fff" stroke="#178970" stroke-width="4"/><circle cx="235" cy="38" r="11" fill="#178970" stroke="#fff" stroke-width="5"/></svg></div><p><strong>${esc(c.name)}</strong><br>${esc(c.city)}, Oaxaca</p><div class="note-box amber">El destino es ficticio: no podemos abrir indicaciones reales sin una dirección verificada. En la versión final, este botón abrirá un servicio de mapas hacia el centro seleccionado.</div><div class="modal-footer"><button class="btn btn-green" data-action="close-modal">Entendido</button></div></div></div>`;}
function bookingAside(step){let c=centerById(state.selected);return `<aside class="booking-aside"><span class="eyebrow">Solicitud de cita</span><h3>${esc(c.name)}</h3><p class="muted small">${esc(c.city)}</p><div class="step-side ${step===1?'current':''}"><i>${step>1?'✓':'1'}</i> Datos personales</div><div class="step-side ${step===2?'current':''}"><i>${step>2?'✓':'2'}</i> Fecha y horario</div><div class="step-side ${step===3?'current':''}"><i>3</i> Confirmación</div><div class="note-box amber" style="margin-top:22px">✳ La cita y la disponibilidad son simuladas y solo existen durante esta sesión del navegador.</div></aside>`;}
function bookingData(){let p=state.bookingPersonal||{};return `<section class="page-intro"><div class="wrap"><span class="eyebrow">Agendar cita</span><h1>Primero, tus datos.</h1><p>Completa la información necesaria para identificar la solicitud en el centro seleccionado.</p></div></section><div class="wrap booking-layout">${bookingAside(1)}<div class="booking-content"><span class="eyebrow">Paso 1 de 3</span><h2>Datos para tu cita</h2><p>Estos datos no se solicitaron al registrarte. Solo los pedimos en esta parte del recorrido.</p><form id="booking-form"><div class="form-grid"><div><label class="field-label" for="book-name">Nombre(s) *</label><input class="field" id="book-name" name="name" autocomplete="given-name" required maxlength="80" value="${esc(p.name||'')}" placeholder="Escribe tu nombre" /></div><div><label class="field-label" for="book-last">Apellidos *</label><input class="field" id="book-last" name="last" autocomplete="family-name" required maxlength="100" value="${esc(p.last||'')}" placeholder="Escribe tus apellidos" /></div><div><label class="field-label" for="book-phone">Teléfono (opcional)</label><input class="field" id="book-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" value="${esc(p.phone||'')}" placeholder="Número de contacto" /></div><div><label class="field-label" for="book-contact">Correo de contacto</label><input class="field" id="book-contact" type="email" value="${esc(state.session?.email||'')}" readonly title="Tomado de la cuenta de demostración" /></div></div><div class="note-box" style="margin-top:22px">Privacidad en este prototipo: los datos se mantienen solo en memoria mientras está abierta la página; no se envían ni almacenan en un servidor. No solicitamos información médica ni el motivo de consulta.</div><div class="form-buttons"><button class="btn btn-outline" type="button" data-page="detalle">← Volver a la ficha</button><button class="btn btn-green" type="submit">Elegir fecha y hora →</button></div></form></div></div>`;}
function bookingCalendar(){if(!state.bookingPersonal){setTimeout(()=>go('cita-datos'),0);return '';}return `<section class="page-intro"><div class="wrap"><span class="eyebrow">Agendar cita</span><h1>Selecciona fecha y horario.</h1><p>Elige un día del calendario y después uno de los horarios habilitados en la demostración.</p></div></section><div class="wrap booking-layout">${bookingAside(2)}<div class="booking-content"><span class="eyebrow">Paso 2 de 3</span><h2>Calendario de disponibilidad</h2><p>Los horarios se muestran para probar la interacción; no representan disponibilidad real de una clínica.</p><div class="calendar-head"><h3 id="calendar-month-title"></h3><div class="action-row"><button type="button" class="round-btn" data-action="prev-month" aria-label="Mes anterior">‹</button><button type="button" class="round-btn" data-action="next-month" aria-label="Mes siguiente">›</button></div></div><div class="weekday-grid"><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span></div><div class="calendar-grid" id="calendar-days"></div><div class="divider"></div><h3 style="font-size:18px">Horarios disponibles (ejemplo)</h3><p class="small muted" id="selected-date-label">Selecciona primero una fecha.</p><div class="time-grid" id="calendar-times"></div><div class="form-buttons"><button class="btn btn-outline" type="button" data-page="cita-datos">← Volver a mis datos</button><button class="btn btn-green" type="button" data-action="confirm-booking" id="confirm-booking" ${state.bookingDate&&state.bookingTime?'':'disabled'}>Generar cita →</button></div></div></div>`;}
function availableSlots(iso){if(!iso)return[];let date=new Date(iso+'T12:00:00');const day=date.getDay();if(day===0)return[];const slots=day===6?['09:00','10:30','12:00']:['09:00','10:00','11:30','13:00','15:00','16:00'];return slots.filter((_,i)=>(date.getDate()+i*3)%5!==0);}
function drawCalendar(){if(!$('calendar-days'))return;const today=new Date();today.setHours(0,0,0,0);const last=addDays(today,59);if(!state.bookingMonth)state.bookingMonth=new Date(today.getFullYear(),today.getMonth(),1);let month=state.bookingMonth;let title=$('calendar-month-title');title.textContent=new Intl.DateTimeFormat('es-MX',{month:'long',year:'numeric'}).format(month);let prev=new Date(month.getFullYear(),month.getMonth()-1,1);document.querySelector('[data-action="prev-month"]').disabled=prev<new Date(today.getFullYear(),today.getMonth(),1);let next=new Date(month.getFullYear(),month.getMonth()+1,1);document.querySelector('[data-action="next-month"]').disabled=next>new Date(last.getFullYear(),last.getMonth(),1);const firstDay=(month.getDay()+6)%7,days=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();let html=Array(firstDay).fill('<span class="day empty-day"></span>').join('');for(let d=1;d<=days;d++){let date=new Date(month.getFullYear(),month.getMonth(),d);let iso=isoLocal(date);let enabled=date>=today&&date<=last&&date.getDay()!==0&&availableSlots(iso).length>0;html+=`<button type="button" class="day ${enabled?'available':'unavailable'} ${state.bookingDate===iso?'selected':''}" ${enabled?'':'disabled'} data-action="select-day" data-date="${iso}" aria-label="${esc(fmtDate(iso))}">${d}</button>`;}$('calendar-days').innerHTML=html;$('selected-date-label').textContent=state.bookingDate?'Fecha: '+fmtDate(state.bookingDate):'Selecciona primero una fecha.';let times=availableSlots(state.bookingDate);$('calendar-times').innerHTML=times.length?times.map(t=>`<button type="button" class="time ${state.bookingTime===t?'selected':''}" data-action="select-time" data-time="${t}">${t}</button>`).join(''):'<p class="small muted" style="grid-column:1/-1">Elige un día disponible para ver las horas.</p>';$('confirm-booking').disabled=!(state.bookingDate&&state.bookingTime);}
function bookingSuccess(){let last=state.appointments.at(-1);if(!last){setTimeout(()=>go('mapa'),0);return '';}return `<section class="page-intro"><div class="wrap"><span class="eyebrow">Agendar cita</span><h1>Solicitud finalizada.</h1><p>Has completado el recorrido de agendamiento dentro del prototipo.</p></div></section><div class="wrap booking-layout">${bookingAside(3)}<div class="booking-content"><div class="success"><div class="success-icon">✓</div><h2>¡Cita de demostración generada!</h2><p>No se ha enviado nada a una clínica. Esta confirmación existe únicamente para evaluar el diseño y las interacciones.</p><div class="summary"><div class="summary-row"><span>Centro</span><b>${esc(last.center)}</b></div><div class="summary-row"><span>Nombre de quien solicita</span><b>${esc(last.name)}</b></div><div class="summary-row"><span>Fecha</span><b>${esc(fmtDate(last.date))}</b></div><div class="summary-row"><span>Hora</span><b>${esc(last.time)} h</b></div><div class="summary-row"><span>Referencia de prueba</span><b>${esc(last.ref)}</b></div><div class="summary-row"><span>Estado</span><b>Solo demostración</b></div></div><div class="action-row" style="justify-content:center"><button class="btn btn-green" data-page="mis-citas">Ver mis citas</button><button class="btn btn-outline" data-page="mapa">Volver al mapa</button></div></div></div></div>`;}
function appointments(){return `<section class="page-intro"><div class="wrap"><span class="eyebrow">Tu cuenta</span><h1>Mis citas</h1><p>Consulta las solicitudes creadas en esta sesión del prototipo.</p></div></section><div class="wrap"><div class="note-box amber" style="margin-top:26px">✳ Las solicitudes solo existen en la memoria de esta página. Al actualizar o cerrar el prototipo, desaparecen.</div>${state.appointments.length?`<div class="appointments-grid">${state.appointments.map(a=>`<div class="appointment-card"><span class="demo-pill">Cita simulada</span><h3>${esc(a.center)}</h3><p>◷ ${esc(fmtDate(a.date))} · ${esc(a.time)} h</p><p>◯ ${esc(a.name)}</p><div class="divider"></div><p>Referencia: ${esc(a.ref)}</p></div>`).join('')}</div>`:`<div class="center-empty"><h2>Aún no tienes citas de demostración.</h2><p class="muted">Cuando completes el recorrido desde una ficha, tu solicitud aparecerá aquí.</p><button class="btn btn-green" data-page="mapa">Explorar centros →</button></div>`}</div>`;}
function clinicDashboard(){const draft=state.clinicDraft;return `<section class="page-intro"><div class="wrap"><span class="eyebrow">Portal de clínicas</span><h1>Panel de clínica</h1><p>Espacio reservado para los centros que desean gestionar sus datos y solicitudes. Estamos definiendo este flujo por separado.</p></div></section><div class="wrap clinic-shell"><aside class="clinic-nav"><h3 style="margin:0 0 6px;color:#fff">Área clínica</h3><p>Sesión de demostración</p><button class="active">▦ Resumen</button><button data-action="clinic-soon">▤ Mi centro</button><button data-action="clinic-soon">◷ Citas y horarios</button><button data-action="clinic-soon">⚙ Configuración</button></aside><div><div class="box-card"><span class="demo-pill">Vista preliminar · Sin backend</span><h2 style="margin:16px 0 8px">¡Bienvenida, clínica!</h2><p class="muted small">Esta es una primera aproximación a la cuenta clínica. La gestión de centros y citas se diseñará con más detalle en la siguiente etapa.</p><div class="metric-grid" style="margin:22px 0"><div class="metric"><b>0</b><span>Centros publicados</span></div><div class="metric"><b>0</b><span>Citas reales recibidas</span></div><div class="metric"><b>0</b><span>Horarios reales</span></div></div><div class="divider"></div><h3>Identificación del centro (ejemplo)</h3><p class="small muted">Como el registro de la cuenta solo requirió correo y contraseña, los datos institucionales se capturarían después en este espacio.</p><form id="clinic-form"><label class="field-label" for="clinic-name">Nombre de la clínica</label><input class="field" id="clinic-name" required maxlength="120" placeholder="Nombre del centro" value="${esc(draft?.name||'')}"/><label class="field-label" for="clinic-city">Municipio</label><input class="field" id="clinic-city" required maxlength="100" placeholder="Municipio en Oaxaca" value="${esc(draft?.city||'')}"/><button type="submit" class="btn btn-green" style="margin-top:20px">Guardar borrador de ejemplo</button></form>${draft?`<div class="note-box" style="margin-top:14px">Borrador de esta sesión: <b>${esc(draft.name)}</b> · ${esc(draft.city)}. No se publica en el mapa.</div>`:''}</div></div></div>`;}
/* Ajustes de la vista de referencia, conservando la estructura visual del prototipo. */
const educationLayout=education;
education=function(){return educationLayout().replace('centros, horarios y citas son simulados. No se debe utilizar para localizar atención real.','el directorio se inspira en registros de PuntOax, pero esta copia puede estar desactualizada. Las citas son simuladas; confirma la información con cada centro.');};
directory=function(){const cities=[...new Set(DEMO_CENTERS.map(c=>c.city))];return `<section class="wrap directory-shell"><div class="directory-title"><div><span class="eyebrow">Directorio de PuntOax</span><h1>Encuentra un centro de atención.</h1><p>Explora registros de referencia de PuntOax y prueba los filtros. Confirma la información antes de acudir.</p></div><span class="demo-pill">✳ Copia estática · citas simuladas</span></div><div class="toolbar"><input class="field query" id="filter-query" placeholder="⌕ Buscar centro, municipio o servicio" aria-label="Buscar centro" value="${esc(state.filters.query)}"/><select class="field" id="filter-service" aria-label="Filtrar por servicio"><option value="">Todos los servicios</option>${['Detección de ITS','Orientación'].map(s=>`<option value="${esc(s)}" ${state.filters.service===s?'selected':''}>${esc(s)}</option>`).join('')}</select><select class="field" id="filter-city" aria-label="Filtrar por municipio"><option value="">Todos los municipios</option>${cities.map(c=>`<option value="${esc(c)}" ${state.filters.city===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select class="field" id="filter-cost" aria-label="Filtrar por costo"><option value="">Cualquier costo</option>${['Gratuito según fuente','Por confirmar'].map(c=>`<option value="${esc(c)}" ${state.filters.cost===c?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="btn btn-outline tool-btn" data-action="reset-filters">Limpiar</button></div><div class="dir-grid"><section class="dir-results" aria-label="Resultados de búsqueda"><p class="bold small" style="margin:0 0 13px" id="result-count"></p><div id="results"></div></section><section class="map-stage" aria-label="Mapa de referencia"><div class="fallback-map" id="fallback-map"></div><div class="real-map" id="real-map"></div><div class="map-label">${iconPin()} <span>Oaxaca · Directorio de referencia</span><br/><span class="muted" style="font-weight:500">Selecciona un marcador o tarjeta</span></div></section></div></section>`;};
resultHTML=function(c){return `<article class="result-card ${state.selected===c.id?'selected':''}" id="card-${esc(c.id)}"><span class="demo-pill">${esc(c.zone)}</span><h3>${esc(c.name)}</h3><p>${iconPin()} ${esc(c.city)} · ${esc(c.type)}</p><div class="chip-row">${c.service.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}<span class="chip">${esc(c.cost)}</span></div><p class="small muted">${esc(c.hours)}${c.approx?' · Ubicación aproximada':''}</p><div class="result-actions"><button class="btn btn-ghost btn-sm" data-action="focus-center" data-id="${esc(c.id)}">Ver en mapa</button><button class="btn btn-green btn-sm" data-action="open-detail" data-id="${esc(c.id)}">Ficha completa →</button></div></article>`;};
popupContent=function(c){return `<div><span class="demo-pill">${esc(c.zone)}</span><div class="pop-name">${esc(c.name)}</div><div class="small muted">${esc(c.city)}<br>${esc(c.hours)}${c.approx?'<br>Pin aproximado':''}</div><div class="pop-actions"><button type="button" data-action="route-demo" data-id="${esc(c.id)}">Ver dirección</button><button type="button" data-action="open-detail" data-id="${esc(c.id)}">Ficha completa →</button></div></div>`;};
renderResults=function(){const list=filteredCenters(),count=$('result-count'),container=$('results');if(!count||!container)return;count.textContent=`${list.length} registro${list.length===1?'':'s'} de referencia`;container.innerHTML=list.length?list.map(resultHTML).join(''):'<div class="empty"><b>No se encontraron coincidencias.</b><p>Prueba con otro municipio o elimina los filtros.</p><button class="btn btn-ghost btn-sm" data-action="reset-filters">Limpiar filtros</button></div>';refreshMarkers(list);};
detail=function(){const c=centerById(state.selected);return `<section class="page-intro"><div class="wrap"><button class="text-link" data-page="mapa">← Volver al mapa</button><div style="margin-top:15px"><span class="eyebrow">Ficha del directorio</span><h1>${esc(c.name)}</h1><p>${esc(c.city)} · ${esc(c.zone)} · Oaxaca</p></div></div></section><div class="wrap detail-wrap"><div class="box-card"><span class="demo-pill">Copia de referencia · PuntOax</span><h2 style="font-size:26px;margin:16px 0 6px">Información general</h2><p class="detail-blurb">${esc(c.description)}</p><div class="divider"></div><section class="detail-section"><h3>Servicios documentados</h3><div class="service-tags">${c.service.map(s=>`<span>${esc(s)}</span>`).join('')}</div></section><div class="divider"></div><section class="detail-section"><h3>Datos del centro</h3><div class="info-grid"><div class="info-item"><b>◷ Horario registrado</b><span>${esc(c.hours)}</span></div><div class="info-item"><b>◇ Costo</b><span>${esc(c.cost)}</span></div><div class="info-item"><b>▤ Condiciones de acceso</b><span>${esc(c.requirements)}</span></div><div class="info-item"><b>⌁ Institución</b><span>${esc(c.type)}</span></div><div class="info-item"><b>⌖ Dirección${c.approx?' (pin aproximado)':''}</b><span>${esc(c.address)}</span></div><div class="info-item"><b>☏ Contacto</b><span>${esc(c.phone)}</span></div></div></section><div class="divider"></div><div class="note-box amber">Confirma los horarios, servicios, requisitos y ubicación directamente con el centro antes de acudir. Esta es una copia estática del directorio de PuntOax.</div><p class="small muted"><a href="https://angixs-zz.github.io/PuntOax/mapa?punto=${encodeURIComponent(c.id.slice(6))}" target="_blank" rel="noopener noreferrer" class="text-link">Consultar ficha en PuntOax ↗</a></p><div class="detail-book"><span class="eyebrow">Recorrido de interfaz</span><h3>Probar una solicitud de cita</h3><p>El calendario y la cita son simulados: no se contacta al centro.</p><button class="btn btn-green" data-action="start-booking">Simular cita →</button></div></div><aside class="box-card"><h3>Ubicación de referencia</h3><p class="small muted">${esc(c.address)}${c.approx?' · Pin aproximado':''}</p><div id="detail-map" style="height:300px;border-radius:14px;overflow:hidden;background:var(--mist)"></div><button class="btn btn-outline" style="margin-top:16px" data-action="route-demo" data-id="${esc(c.id)}">Ver dirección</button></aside></div>`;};
routeDemo=function(id){const c=centerById(id);$('modal-root').innerHTML=`<div class="overlay" id="route-overlay" role="dialog" aria-modal="true" aria-labelledby="route-title"><div class="modal"><span class="eyebrow">Dirección registrada</span><h2 id="route-title">${esc(c.name)}</h2><p>${esc(c.address)}</p><div class="note-box amber">${c.approx?'La ubicación del marcador es aproximada. ':''}Confirma la dirección y disponibilidad antes de acudir.</div><div class="modal-footer"><button class="btn btn-green" data-action="close-modal">Entendido</button></div></div></div>`;};
initDirectoryMap=function(){showFallbackMap(filteredCenters());};
initDetailMap=function(){const el=$('detail-map');if(!el)return;el.classList.add('simulated-detail-map');el.style.background="url('mapa-oaxaca-simulado.svg') center / cover no-repeat #e9f3ee";};
function clinicBindings(){}
function profile(){let s=state.session;return `<section class="page-intro"><div class="wrap"><span class="eyebrow">Configuración</span><h1>Mi cuenta</h1><p>Información básica de la sesión de demostración.</p></div></section><div class="wrap" style="padding:32px 0 80px"><div class="box-card" style="max-width:640px"><div class="profile-box"><div class="avatar">${esc((s?.email||'U')[0].toUpperCase())}</div><div><b>${esc(s?.role==='clinica'?'Cuenta clínica':'Cuenta de usuario')}</b><div>${esc(s?.email||'')}</div></div></div><div class="divider"></div><h3>Datos registrados</h3><div class="info-grid"><div class="info-item"><b>Correo electrónico</b><span>${esc(s?.email||'')}</span></div><div class="info-item"><b>Tipo de cuenta</b><span>${esc(s?.role||'')}</span></div></div><p class="small muted" style="margin-top:19px">Para una cuenta de usuario, los datos de identificación no se solicitan hasta iniciar el proceso de cita.</p><button class="btn btn-outline" data-action="logout">Cerrar sesión</button></div></div>`;}
function setUpEvents(){document.addEventListener('click',function(ev){let a=ev.target.closest('[data-action],[data-page]');if(!a)return;if(a.dataset.page){ev.preventDefault();go(a.dataset.page);return;}switch(a.dataset.action){case 'logout':logout();break;case 'get-started':if(state.session)go(state.session.role==='clinica'?'clinica':'mapa');else{state.authMode='registro';state.authRole='usuario';state.wanted='mapa';go('acceso');}break;case 'auth-login':state.authMode='login';go('acceso');break;case 'auth-register':state.authMode='registro';go('acceso');break;case 'toggle-auth':state.authMode=state.authMode==='registro'?'login':'registro';render();break;case 'set-role':state.authRole=a.dataset.value;render();break;case 'google-demo':state.session={role:state.authRole,email:state.authRole==='clinica'?'clinica.demo@ejemplo.invalid':'usuario.demo@ejemplo.invalid',provider:'google-demo'};state.bookingPersonal=null;go(state.session.role==='clinica'?'clinica':'mapa');notify('Google simulado: solo se abrió la interfaz. No se inició sesión con Google.');break;case 'reset-filters':state.filters={query:'',service:'',city:'',cost:''};render();break;case 'focus-center':focusCenter(a.dataset.id);break;case 'fallback-focus':state.selected=a.dataset.id;focusCenter(a.dataset.id);break;case 'open-detail':state.selected=a.dataset.id;go('detalle');break;case 'route-demo':routeDemo(a.dataset.id);break;case 'close-modal':$('modal-root').innerHTML='';break;case 'start-booking':state.bookingPersonal=null;state.bookingDate='';state.bookingTime='';state.bookingMonth=null;go('cita-datos');break;case 'select-day':state.bookingDate=a.dataset.date;state.bookingTime='';drawCalendar();break;case 'select-time':state.bookingTime=a.dataset.time;drawCalendar();break;case 'prev-month':state.bookingMonth=new Date(state.bookingMonth.getFullYear(),state.bookingMonth.getMonth()-1,1);drawCalendar();break;case 'next-month':state.bookingMonth=new Date(state.bookingMonth.getFullYear(),state.bookingMonth.getMonth()+1,1);drawCalendar();break;case 'confirm-booking':if(!state.bookingDate||!state.bookingTime){notify('Selecciona una fecha y un horario para continuar.');return;}let c=centerById(state.selected);let ref='DEMO-'+String(state.appointments.length+1).padStart(3,'0');state.appointments.push({center:c.name,centerId:c.id,name:(state.bookingPersonal.name+' '+state.bookingPersonal.last).trim(),date:state.bookingDate,time:state.bookingTime,ref});go('cita-exito');break;case 'clinic-soon':notify('Esta sección se diseñará en la siguiente etapa.');break;}}
);document.addEventListener('submit',function(ev){if(ev.target.id==='auth-form'){ev.preventDefault();let form=new FormData(ev.target),email=String(form.get('email')||'').trim(),password=String(form.get('password')||''),confirm=String(form.get('confirm')||'');if(state.authMode==='registro'&&password!==confirm){notify('Las contraseñas no coinciden.');return;}state.session={role:state.authRole,email,provider:'demo'};state.bookingPersonal=null;state.appointments=[];go(state.authRole==='clinica'?'clinica':state.wanted==='detalle'?'mapa':state.wanted||'mapa');notify('Acceso visual simulado. No se validaron ni almacenaron tus credenciales.');}if(ev.target.id==='booking-form'){ev.preventDefault();let fd=new FormData(ev.target),name=String(fd.get('name')||'').trim(),last=String(fd.get('last')||'').trim(),phone=String(fd.get('phone')||'').trim();if(!name||!last){notify('Escribe tu nombre y apellidos.');return;}state.bookingPersonal={name,last,phone};go('cita-calendario');}if(ev.target.id==='clinic-form'){ev.preventDefault();state.clinicDraft={name:$('clinic-name').value.trim(),city:$('clinic-city').value.trim()};notify('Borrador guardado solo en esta sesión.');render();}});document.addEventListener('input',function(ev){if(ev.target.id==='filter-query'){state.filters.query=ev.target.value;renderResults();}});document.addEventListener('change',function(ev){let k={'filter-service':'service','filter-city':'city','filter-cost':'cost'}[ev.target.id];if(k){state.filters[k]=ev.target.value;renderResults();}});$('burger').addEventListener('click',()=>{state.mobileOpen=!state.mobileOpen;$('mobile-nav').classList.toggle('open',state.mobileOpen);$('burger').setAttribute('aria-expanded',String(state.mobileOpen));});$('modal-root').addEventListener('click',ev=>{if(ev.target.id==='route-overlay')$('modal-root').innerHTML='';});document.addEventListener('keydown',ev=>{if(ev.key==='Escape')$('modal-root').innerHTML='';});window.addEventListener('hashchange',render);}
setUpEvents();render();
</script>
